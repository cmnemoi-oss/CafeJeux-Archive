name: cafejeux

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  cafejeux:
    image: ghcr.io/cmnemoi-oss/cafejeux-archive:${IMAGE_TAG:-main}
    container_name: cafejeux
    ports: ["127.0.0.1:8130:80"]
    restart: unless-stopped
    stop_grace_period: 10s
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(file_get_contents('http://localhost/') !== false ? 0 : 1);\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
          pids: 100
        reservations:
          cpus: "0.25"
          memory: 128M
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
